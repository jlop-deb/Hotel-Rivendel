<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Reserva</title>
</head>
<body>
    <h1>Haga su reserva</h1>
    <form action="procesareserva.php" method="get">
    <fieldset>
    <legend>Datos Personales:</legend>
    <p>
        <label for="nom">Nombre:</label>
        <input type="text" maxlength="100"
        name="nombre" required autofocus
        id="nom">
    </p>
    <p>        
        <label for="ape">Apellidos:</label>
        <input type="text" maxlength="100"
        name="ape" required
        id="ape">
    </p>
    <p>
        <label for="dni">DNI:</label>
        <input type="text"
        name="dni" required placeholder="DNI con letra" maxlength="10"
        id="dni">
    </p>
     </fieldset>

     <fieldset>
        <legend>Datos de su estancia:</legend>

    <p>Habitación:</p>
    <p>
        <label for="Individual">Individual</label>
        <input type="radio" name="habitacion" value="Individual"
        id="Individual">
        <label for="Doble">Doble</label>
        <input type="radio" name="habitacion" value="Doble"
        id="Doble">
        <label for="Triple">Triple</label>
        <input type="radio" name="habitacion" value="Triple"
        id="Triple">
    </p>
    <p>
        <label for="huespedes">Huéspedes:</label>
        <select name="huespedes" id="huespedes">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        </select>
    <p>
        <label for="mascotas">Llevo Mascotas:</label>
        <input type="checkbox" name="mascotas"
        id="mascotas">
    </p>
    <p>
        <label for="fecha">Fecha de llegada:</label>
        <input type="date" name="fecha"
        id="fecha">
    </p>
    <p>
        <label for="hora">Hora de llegada:</label>
        <input type="time" name="hora"
        id="hora">
    </p>
    </fieldset>
    <p>
        <input type="submit" name="Enviar">
    </p>
    <p>
        <input type="reset" value="Reiniciar formulario">
    </p>

    <!---Revisar los videos a ver si los botones van dentro o fuera de FORM-->
    
</form>

<a href="index.html">Volver a página de inicio</a>
   
</body>
</html>
